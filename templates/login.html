<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Expense Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand" style="justify-content:center;margin-bottom:22px;">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.6"/></svg>
        </div>
        <div class="brand-text">
          <div class="name">Expense Manager</div>
          <div class="sub">Controle de despesas</div>
        </div>
      </div>

      <h1 class="auth-title">Entrar</h1>
      <div class="subtitle" style="text-align:center;margin-bottom:22px;">Acesse suas despesas</div>

      {% with mensagens = get_flashed_messages() %}
        {% if mensagens %}
          <div class="auth-flash">
            {% for m in mensagens %}<div>{{ m }}</div>{% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="POST">
        <div class="field" style="margin-bottom:14px;">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
        </div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:20px;">Entrar</button>
      </form>

      <div class="auth-footer">
        Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
      </div>
    </div>
  </div>
</body>
</html>
